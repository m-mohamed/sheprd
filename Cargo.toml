[package]
name = "sheprd"
version = "0.1.0"
edition = "2021"
description = "Smart session manager for Herdr"
license = "AGPL-3.0-or-later"
keywords = ["terminal", "herdr", "session", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
