[package]
name = "sheprd"
version = "0.2.0"
edition = "2021"
description = "Keep every coding agent in frame with Herdr"
license = "AGPL-3.0-or-later"
documentation = "https://docs.rs/sheprd"
keywords = ["terminal", "herdr", "session", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
  "src/**/*",
  "scripts/open-flok-picker.sh",
  "herdr-plugin.toml",
  "tests/**/*",
  "docs/**/*.md",
  "website/assets/sheprd-mark.svg",
  "website/**/*.html",
  "scripts/**/*.sh",
  ".github/**/*.yml",
  ".github/pull_request_template.md",
  ".githooks/*",
  "README.md",
  "AGENTS.md",
  "LICENSE",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SKILL.md",
  "agent-guide.md",
  "justfile",
  "Cargo.toml",
  "Cargo.lock",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
