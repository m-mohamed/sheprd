[package]
name = "sheprd"
version = "0.3.0"
edition = "2021"
rust-version = "1.92"
description = "Keep every coding agent in frame with Herdr"
license = "AGPL-3.0-or-later"
repository = "https://github.com/m-mohamed/sheprd"
homepage = "https://github.com/m-mohamed/sheprd"
documentation = "https://github.com/m-mohamed/sheprd/tree/main/docs"
keywords = ["herdr", "coding-agents", "multi-agent", "terminal", "orchestration"]
categories = ["command-line-utilities", "development-tools"]
publish = false
include = [
  "src/**/*",
  "scripts/open-flok-picker.sh",
  "scripts/install-plugin.sh",
  "herdr-plugin.toml",
  "tests/**/*",
  "docs/**/*.md",
  "website/assets/sheprd-mark.svg",
  "website/**/*.html",
  "scripts/**/*.sh",
  "README.md",
  "AGENTS.md",
  "LICENSE",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "deny.toml",
  "rust-toolchain.toml",
  "SKILL.md",
  "agent-guide.md",
  "justfile",
  "Cargo.toml",
  "Cargo.lock",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
