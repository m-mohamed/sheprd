id = "m-mohamed.sheprd"
name = "Sheprd"
version = "0.2.0"
min_herdr_version = "0.7.5"
description = "Keep every coding agent in frame. Open a visible four-agent Flok in Herdr."
platforms = ["linux", "macos"]

# Managed installs prefer an exact-version, checksum-verified release binary.
# If no matching asset is available, the script performs a locked source build.
[[build]]
command = ["bash", "scripts/install-plugin.sh"]

[[actions]]
id = "open-flok"
title = "Open Flok in current project"
description = "Open or focus Pi, Codex, Claude Code, and OpenCode in one isolated four-agent workspace."
contexts = ["workspace", "tab", "pane"]
command = ["./target/release/sheprd", "flok", "--json"]

[[actions]]
id = "choose-flok"
title = "Choose project and open Flok"
description = "Choose a configured Git project, then open or focus its four-agent Flok."
contexts = ["workspace", "tab", "pane"]
command = ["bash", "scripts/open-flok-picker.sh"]

[[actions]]
id = "doctor"
title = "Check Sheprd Flok readiness"
description = "Check Herdr 0.7.5+, Git, and all four configured agent CLIs without changing a project."
contexts = ["workspace", "tab", "pane"]
command = ["./target/release/sheprd", "doctor", "--json"]

# Plugin actions are headless, so cleanup is deliberately preview-only here.
# A human must run `sheprd cleanup [PROJECT] --confirm` for mutation.
[[actions]]
id = "cleanup-preview"
title = "Preview safe Flok cleanup"
description = "Report whether the current Flok can be closed and its clean worker checkouts removed; changes nothing."
contexts = ["workspace", "tab", "pane"]
command = ["./target/release/sheprd", "cleanup", "--json"]

[[actions]]
id = "cleanup-flok"
title = "Clean up Flok…"
description = "Open an interactive preview and require the project name before closing the Flok; dirty checkouts are preserved."
contexts = ["workspace", "tab", "pane"]
command = ["bash", "scripts/open-flok-cleanup.sh"]

[[panes]]
id = "project-picker"
title = "Sheprd — Open Flok"
placement = "popup"
command = ["./target/release/sheprd", "pick"]

[[panes]]
id = "cleanup-confirm"
title = "Sheprd — Clean up Flok"
placement = "popup"
width = "90%"
height = "80%"
command = ["./target/release/sheprd", "cleanup-prompt"]
