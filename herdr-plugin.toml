id = "m-mohamed.sheprd"
name = "Sheprd"
version = "0.4.2"
min_herdr_version = "0.7.5"
description = "Route canonical projects into Herdr workspaces. The Ratatui factory cockpit owns command-and-control."
platforms = ["linux", "macos"]

# Managed installs prefer an exact-version, checksum-verified release binary.
# If no matching asset is available, the script performs a locked source build.
[[build]]
command = ["bash", "scripts/install-plugin.sh"]

[[actions]]
id = "doctor"
title = "Check Sheprd readiness"
description = "Check Herdr, Git, project discovery, and the focused workspace contract without changing a project."
contexts = ["workspace", "tab", "pane"]
command = ["./target/release/sheprd", "doctor", "--json"]
