name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · package · smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package crate
        run: cargo package --locked
      - name: Validate plugin installer shell
        run: |
          bash -n scripts/install-plugin.sh scripts/open-flok-picker.sh scripts/open-flok-cleanup.sh
          shellcheck scripts/*.sh
      - name: CLI smoke
        run: |
          target/release/sheprd --help
          target/release/sheprd flok --help
          target/release/sheprd cleanup --help
          target/release/sheprd doctor --help
          target/release/sheprd init --print --json
          target/release/sheprd recipes --json
          target/release/sheprd show-config --json
      - name: JSON failure smoke
        run: |
          if target/release/sheprd connect definitely-not-a-project --json >"$RUNNER_TEMP/out" 2>"$RUNNER_TEMP/err"; then
            exit 1
          fi
          test ! -s "$RUNNER_TEMP/out"
          grep '"ok": false' "$RUNNER_TEMP/err"
          grep '"exit_code": 2' "$RUNNER_TEMP/err"
      - name: Validate GitHub metadata
        run: |
          ruby -ryaml -e 'ARGV.each { |path| YAML.load_file(path); puts "ok #{path}" }' \
            .github/workflows/*.yml \
            .github/ISSUE_TEMPLATE/*.yml \
            .github/DISCUSSION_TEMPLATE/*.yml \
            .github/dependabot.yml

  test:
    name: test · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@387aeee55b189f024a4f6d94890c5b18d73339cc # 1.92.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked
