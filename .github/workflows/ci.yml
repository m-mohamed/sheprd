name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release binary
        run: cargo build --release --locked

      - name: CLI smoke
        run: |
          target/release/sheprd --help
          target/release/sheprd init --help
          target/release/sheprd init --print
          target/release/sheprd init --print --json
          target/release/sheprd connect --help
          target/release/sheprd recipes
          target/release/sheprd recipes --json
          target/release/sheprd show-config

      - name: JSON failure smoke
        run: |
          if target/release/sheprd connect definitely-not-a-project --json >"$RUNNER_TEMP/sheprd-json-error.out" 2>"$RUNNER_TEMP/sheprd-json-error.err"; then
            exit 1
          fi
          test ! -s "$RUNNER_TEMP/sheprd-json-error.out"
          grep '"ok": false' "$RUNNER_TEMP/sheprd-json-error.err"
          grep '"exit_code": 2' "$RUNNER_TEMP/sheprd-json-error.err"
          grep "definitely-not-a-project" "$RUNNER_TEMP/sheprd-json-error.err"

      - name: Package crate
        run: cargo package --locked

      - name: Install smoke
        run: |
          SHEPRD_INSTALL_DIR="$RUNNER_TEMP/sheprd-install" scripts/install-local.sh
          "$RUNNER_TEMP/sheprd-install/sheprd" --version

      - name: Validate GitHub metadata
        run: |
          ruby -ryaml -e 'ARGV.each { |path| YAML.load_file(path); puts "ok #{path}" }' \
            .github/workflows/*.yml \
            .github/ISSUE_TEMPLATE/*.yml \
            .github/DISCUSSION_TEMPLATE/*.yml \
            .github/dependabot.yml
