name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sheprd-linux-x86_64
          - os: macos-15-intel
            artifact: sheprd-macos-x86_64
          - os: macos-14
            artifact: sheprd-macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check
        run: cargo fmt --all -- --check && cargo clippy --all-targets -- -D warnings && cargo test

      - name: Build
        run: cargo build --release --locked

      - name: CLI smoke
        run: |
          target/release/sheprd --help
          target/release/sheprd init --help
          target/release/sheprd init --print
          target/release/sheprd init --print --json
          target/release/sheprd connect --help
          target/release/sheprd recipes
          target/release/sheprd recipes --json
          target/release/sheprd show-config

      - name: JSON failure smoke
        run: |
          if target/release/sheprd connect definitely-not-a-project --json >"$RUNNER_TEMP/sheprd-json-error.out" 2>"$RUNNER_TEMP/sheprd-json-error.err"; then
            exit 1
          fi
          test ! -s "$RUNNER_TEMP/sheprd-json-error.out"
          grep '"ok": false' "$RUNNER_TEMP/sheprd-json-error.err"
          grep '"exit_code": 2' "$RUNNER_TEMP/sheprd-json-error.err"
          grep "definitely-not-a-project" "$RUNNER_TEMP/sheprd-json-error.err"

      - name: Package crate
        run: cargo package --locked

      - name: Package
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          cp target/release/sheprd "dist/${{ matrix.artifact }}/sheprd"
          cp README.md LICENSE CHANGELOG.md CONTRIBUTING.md AGENTS.md SKILL.md justfile "dist/${{ matrix.artifact }}/"
          cp -R docs scripts website "dist/${{ matrix.artifact }}/"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes
        run: scripts/extract-release-notes.sh "${GITHUB_REF_NAME#v}" RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          body_path: RELEASE_NOTES.md
