name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sheprd-linux-x86_64
          - os: macos-13
            artifact: sheprd-macos-x86_64
          - os: macos-14
            artifact: sheprd-macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check
        run: cargo fmt --all -- --check && cargo clippy --all-targets -- -D warnings && cargo test

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          cp target/release/sheprd "dist/${{ matrix.artifact }}/sheprd"
          cp README.md LICENSE CHANGELOG.md "dist/${{ matrix.artifact }}/"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes
        run: scripts/extract-release-notes.sh "${GITHUB_REF_NAME#v}" RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          body_path: RELEASE_NOTES.md
