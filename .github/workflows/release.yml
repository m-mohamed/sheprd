name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify tag, crate, and plugin versions agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          manifest="$(sed -nE 's/^version = "([^"]+)"/\1/p' herdr-plugin.toml | head -n 1)"
          test "$tag" = "$crate"
          test "$tag" = "$manifest"
      - name: Verify changelog section exists
        run: scripts/extract-release-notes.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/RELEASE_NOTES.md"

  create-release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Create draft release with exact changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/extract-release-notes.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/RELEASE_NOTES.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Sheprd $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Sheprd $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"
          fi

  binaries:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sheprd
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          token: ${{ github.token }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: sheprd-${{ matrix.target }}.tar.gz

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish only after every target and attestation succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
