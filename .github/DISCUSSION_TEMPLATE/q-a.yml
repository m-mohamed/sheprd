body:
  - type: markdown
    attributes:
      value: |
        Ask a focused question about using sheprd with Herdr.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to understand or accomplish?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Herdr version, OS, terminal, shell, and relevant config.
  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: Commands, output, or docs you already checked.
